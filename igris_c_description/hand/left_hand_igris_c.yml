retargeting:
  type: vector
  urdf_path: hand/left_hand_igris_c_mimic.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ '9_Joint_Little_Middle', '7_Joint_Ring_Middle', '5_Joint_Middle_Middle', '3_Joint_Index_Middle',
                        '1_Joint_Thumb_Middle', '0_Joint_Thumb_Proximal' ]
  target_origin_link_names: [ "world", "world", "world", "world", "world" ]
  target_task_link_names: [ "thumb_tip",  "index_tip", "middle_tip", "ring_tip", "little_tip" ]
  scaling_factor: 1.15 # 1.15

  # Source refers to the retargeting input, which usually corresponds to the human hand
  # The joint indices of human hand joint which corresponds to each link in the target_link_names
  target_link_human_indices: [ [ 0, 0, 0, 0, 0 ], [ 4, 9, 14, 19, 24 ] ]
  # target_link_human_indices: [ [ 0, 0, 0, 0, 0 ], [ 4, 8, 12, 16, 20 ] ]

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2